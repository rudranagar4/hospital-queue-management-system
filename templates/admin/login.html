{% extends 'base.html' %}

{% block title %}Administrator Portal — SmartCare Command{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5 animate-entrance">
      <div class="admin-card p-4 p-md-5 border-2 shadow-lg">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 bg-success bg-opacity-15 text-success rounded-circle mb-3 border border-success border-opacity-25">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h2 class="fw-bold text-white">Hospital Administration</h2>
          <p class="text-secondary small">Authorized Medical Personnel & Queue Command System</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Administrator Email</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-end-0 text-secondary"><i class="bi bi-shield-check"></i></span>
              <input type="email" name="email" id="admin-email-field" class="form-control border-start-0" placeholder="admin@hospital.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Master Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary border-end-0 text-secondary"><i class="bi bi-key-fill"></i></span>
              <input type="password" name="password" id="admin-pass-field" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input type="checkbox" name="remember" class="form-check-input bg-dark border-secondary" id="rememberAdmin">
              <label class="form-check-label small text-secondary" for="rememberAdmin">Keep session alive</label>
            </div>
            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none text-success" onclick="fillDemoAdmin()">
              <i class="bi bi-lightning-charge me-1"></i> Demo Fill
            </button>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fs-6 fw-bold mb-3 shadow">
            <i class="bi bi-box-arrow-in-right me-1"></i> Open Command Center
          </button>
        </form>

        <div class="text-center pt-3 border-top border-secondary border-opacity-25 small text-secondary">
          Restricted access. Public registration is disabled.
        </div>
      </div>

      <div class="text-center mt-3 small">
        <a href="{{ url_for('auth.patient_login') }}" class="text-secondary text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Back to Patient Portal
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  function fillDemoAdmin() {
    document.getElementById('admin-email-field').value = 'admin@hospital.com';
    document.getElementById('admin-pass-field').value = 'admin123';
  }
</script>
{% endblock %}
