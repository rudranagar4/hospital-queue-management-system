{% extends 'base.html' %}

{% block title %}Patient Registration — SmartCare Queue{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 animate-entrance">
      <div class="glass-card p-4 p-md-5 border-2">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-3">
            <i class="bi bi-person-plus-fill fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark">Patient Registration</h2>
          <p class="text-muted small">Create your digital patient profile to book tokens from home or phone</p>
        </div>

        <form method="POST" action="{{ url_for('auth.patient_register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Full Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" name="name" class="form-control border-start-0" placeholder="e.g. Eleanor Vance" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-7">
              <label class="form-label fw-semibold small text-secondary">Mobile Phone <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                <input type="tel" name="phone" class="form-control border-start-0" placeholder="+1-555-0199" required>
              </div>
            </div>
            <div class="col-md-5">
              <label class="form-label fw-semibold small text-secondary">Age</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                <input type="number" name="age" class="form-control border-start-0" min="1" max="125" placeholder="e.g. 32">
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control border-start-0" placeholder="eleanor@example.com" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold small text-secondary">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Min. 6 chars" required minlength="6">
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small text-secondary">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                <input type="password" name="confirm_password" class="form-control border-start-0" placeholder="Repeat password" required minlength="6">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-patient-primary w-100 py-2 fs-6 mb-3">
            <i class="bi bi-check2-circle me-1"></i> Complete Registration & Sign In
          </button>
        </form>

        <div class="text-center pt-3 border-top small text-muted">
          Already registered? 
          <a href="{{ url_for('auth.patient_login') }}" class="text-primary fw-bold text-decoration-none ms-1">
            Sign In Here
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
