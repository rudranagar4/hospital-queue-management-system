{% extends 'base.html' %}

{% block title %}Patient Sign In — SmartCare Queue{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5 animate-entrance">
      <div class="glass-card p-4 p-md-5 border-2">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-3">
            <i class="bi bi-person-heart fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark">Patient Portal</h2>
          <p class="text-muted small">Access your live digital token and consultation tracker</p>
        </div>

        <form method="POST" action="{{ url_for('auth.patient_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" id="email-field" class="form-control border-start-0" placeholder="patient@hospital.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" id="password-field" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
            </div>
            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none text-primary" onclick="fillDemoPatient()">
              <i class="bi bi-magic me-1"></i> Demo Fill
            </button>
          </div>

          <button type="submit" class="btn btn-patient-primary w-100 py-2 fs-6 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Patient Portal
          </button>
        </form>

        <div class="text-center pt-3 border-top small text-muted">
          Don't have an account yet? 
          <a href="{{ url_for('auth.patient_register') }}" class="text-primary fw-bold text-decoration-none ms-1">
            Register as New Patient
          </a>
        </div>
      </div>

      <div class="text-center mt-3 small">
        <a href="{{ url_for('auth.admin_login') }}" class="text-muted text-decoration-none">
          <i class="bi bi-shield-lock me-1"></i> Switch to Administrator Portal
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  function fillDemoPatient() {
    document.getElementById('email-field').value = 'patient@hospital.com';
    document.getElementById('password-field').value = 'PatientPassword123!';
  }
</script>
{% endblock %}
